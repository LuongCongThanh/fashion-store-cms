<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fashion Store CMS</title>
    <!-- Chống nháy trắng: gắn class dark trước khi Vue chạy. Key khớp useTheme() (§L.11). -->
    <script>
      try {
        const m = localStorage.getItem('cms.colorMode') || 'auto'
        const dark =
          m === 'dark' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
