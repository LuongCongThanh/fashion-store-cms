version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      vue:
        patterns:
          ['vue', 'vue-*', '@vue/*', 'vue-router', 'vue-i18n', 'pinia', '@pinia/*', '@vueuse/*']
      nuxt-ui:
        patterns: ['@nuxt/ui', 'tailwindcss', '@iconify-json/*']
      eslint:
        patterns: ['eslint', 'eslint-*', 'typescript-eslint', '@typescript-eslint/*']
      vitest:
        patterns: ['vitest', '@vitest/*', '@vue/test-utils', 'jsdom']
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
