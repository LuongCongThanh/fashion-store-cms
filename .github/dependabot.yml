version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      vue:
        patterns:
          ['vue', 'vue-*', '@vue/*', 'vue-router', 'vue-i18n', 'pinia', '@pinia/*', '@vueuse/*']
      nuxt-ui:
        patterns: ['@nuxt/ui', 'tailwindcss', '@iconify-json/*']
      eslint:
        patterns: ['eslint', 'eslint-*', 'typescript-eslint', '@typescript-eslint/*']
      vitest:
        patterns: ['vitest', '@vitest/*', '@vue/test-utils', 'jsdom']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
