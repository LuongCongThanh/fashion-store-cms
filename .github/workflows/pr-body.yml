name: PR body

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  template-sections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/pull_request_template.md
            scripts/check-pr-body.sh
          sparse-checkout-cone-mode: false
      - name: Check body follows .github/pull_request_template.md
        env:
          BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          # PR release (dev -> main) và PR của bot (Dependabot) được miễn kiểm
          if [[ "$HEAD_REF" == "dev" || "$AUTHOR_TYPE" == "Bot" ]]; then
            echo "Exempt: head=$HEAD_REF author=$AUTHOR_TYPE"
            exit 0
          fi
          # Cùng script với hook Claude Code (.claude/hooks/pr-body-guard.sh)
          printf '%s' "$BODY" | bash scripts/check-pr-body.sh -
