name: PR body

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  template-sections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/pull_request_template.md
          sparse-checkout-cone-mode: false
      - name: Check body follows .github/pull_request_template.md
        env:
          BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          # PR release (dev -> main) và PR của bot (Dependabot) được miễn kiểm
          if [[ "$HEAD_REF" == "dev" || "$AUTHOR_TYPE" == "Bot" ]]; then
            echo "Exempt: head=$HEAD_REF author=$AUTHOR_TYPE"
            exit 0
          fi
          # Heading và ô **...:** bắt buộc lấy thẳng từ template (một nguồn duy nhất)
          tpl=.github/pull_request_template.md
          mapfile -t required < <(
            grep -E '^#{1,3} ' "$tpl"
            grep -oE '^(- )?\*\*[^*]+:\*\*' "$tpl" | sed 's/^- //'
          )
          status=0
          for h in "${required[@]}"; do
            if [[ "$BODY" != *"$h"* ]]; then
              echo "::error::Missing section: $h"
              status=1
            fi
          done
          if grep -Eq '^(- )?\*\*[^*]+:\*\*[[:space:]]*(<!--|$)' <<< "${BODY//$'\r'/}"; then
            echo "::error::Còn ô **...:** để trống hoặc giữ placeholder (ghi \"Không\" nếu không có)"
            status=1
          fi
          if grep -Eq '^-[[:space:]]*$' <<< "${BODY//$'\r'/}"; then
            echo "::error::Changes còn dòng '-' trống"
            status=1
          fi
          ticked=$(grep -Ec '^- \[[xX]\] (✨ Feature|🐛 Bug|♻️ Refactor|⚡ Perf|🧪 Test|🧹 Chore|📚 Docs)[[:space:]]*$' <<< "${BODY//$'\r'/}" || true)
          if [[ "$ticked" != 1 ]]; then
            echo "::error::Tick exactly one Type checkbox (found $ticked)"
            status=1
          fi
          exit $status
